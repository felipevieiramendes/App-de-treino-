<style>
:root{--bg:#07090b;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.11);--tx:#f4f6f8;--mu:#9aa4ab;--ac:#f4f6f8;--dn:#ff6b5e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(70% 45% at 10% 0,rgba(255,255,255,.17),transparent 70%) fixed,radial-gradient(60% 40% at 100% 35%,rgba(150,170,195,.15),transparent 70%) fixed,radial-gradient(70% 40% at 0 100%,rgba(255,255,255,.09),transparent 70%) fixed,#07090b}
*{box-sizing:border-box}
body{margin:0 auto;color:var(--tx);font:16px Barlow,system-ui,sans-serif;max-width:480px;min-height:100vh;padding:20px 18px 130px}
h1,h2,h3,.cd{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;margin:0}
h1{font-size:34px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
button{font:inherit;cursor:pointer;border:0;color:var(--tx);background:var(--card2);border-radius:14px;padding:10px 16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.p{background:var(--ac);color:#0b0e10;font-weight:700}
.g{background:var(--card2)}
.dn{color:var(--dn)}
.ic{width:42px;height:42px;padding:0;border-radius:50%;font-size:20px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px}
.card h2{font-size:26px}
.mu{color:var(--mu);font-size:15px}
.cr{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px}
.start{background:rgba(255,255,255,.08);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;padding:12px 34px;border-radius:30px}
.ex{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ex:last-of-type{border-bottom:0}
.ex>div:first-child{flex:1;min-width:0}
.ex b{font-size:18px;font-weight:500}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{width:36px;height:36px;border-radius:50%;padding:0;background:var(--card2);color:var(--mu);font-weight:700}
.chip.on{background:var(--ac);color:#0b0e10}
.add{width:100%;background:transparent;border:1.5px dashed rgba(255,255,255,.18);color:var(--ac);padding:14px;margin-top:8px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(444px,calc(100% - 24px));display:flex;background:rgba(22,26,30,.62);border:1px solid rgba(255,255,255,.14);border-radius:30px;padding:6px;z-index:5}
.tabs button{flex:1;background:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;border-radius:24px;color:var(--mu)}
.tabs button.on{background:var(--card2);color:var(--ac)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:rgba(24,28,32,.8);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
label{flex:1 1 100%;display:block;color:var(--mu);font-size:14px}
label.s{flex:1 1 28%}
input{width:100%;margin-top:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;color:var(--tx);font:inherit;font-size:17px;padding:11px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .p{margin-left:auto}
.ring{display:block;margin:10px auto 18px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btns button{padding:16px 0;font-weight:700}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.wr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
.bots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}.bt{width:36px;height:68px;border:2px solid rgba(255,255,255,.18);border-radius:10px;position:relative;overflow:hidden;background:rgba(255,255,255,.08)}.bt i{position:absolute;left:0;right:0;bottom:0;background:var(--ac);display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:var(--card2);border-radius:16px;padding:12px 14px}.st b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.sx{display:flex;gap:8px;margin-top:12px}.sx button{flex:1}.sx .on{background:var(--ac);color:#0b0e10;font-weight:700}
.rb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(444px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(24,28,32,.78);border:1.5px solid var(--ac);border-radius:22px;padding:10px 14px;z-index:6}.rb .row{flex-wrap:nowrap}.rb button{padding:8px 12px}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px}.ki{width:56px;margin:0;padding:6px 4px;text-align:center;font-size:15px}
.ts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(444px,calc(100% - 24px));display:none;background:var(--ac);color:#0b0e10;padding:12px 16px;border-radius:18px;z-index:30;font-weight:500}.ts .mu{color:#555}
button,input{touch-action:manipulation}*{-webkit-tap-highlight-color:transparent}
.card,.sh,.tabs,.rb,.st{-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.card{border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.sh{border:1px solid rgba(255,255,255,.14);border-bottom:0}
.tabs{border-color:rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;padding:8px 0}
.chip{width:44px;height:44px;font-size:16px;border:1px solid rgba(255,255,255,.14)}.chip.on{border-color:transparent}
.ki{width:60px;font-size:16px}input{font-size:16px}
.stk{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:4}
.p{box-shadow:0 4px 14px rgba(255,255,255,.14)}
.bt{background:rgba(255,255,255,.06)}.bt i{background:linear-gradient(#fff,#cfd6db)}
.ex.fin b{opacity:.55}

:root{--f:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif}
body,button,input,textarea,h1,h2,h3,.big,.start,.tabs button{font-family:var(--f)}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em}h2{font-size:23px;font-weight:800;letter-spacing:-.02em}h3{font-weight:800}
.big{font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}
button{border-radius:999px;border:1px solid rgba(255,255,255,.12);font-weight:600;transition:transform .12s,background .2s}
button:active{transform:scale(.95)}
.p{background:linear-gradient(180deg,#fff,#c9d1d7);color:#0b0e10;font-weight:800;border-color:rgba(255,255,255,.6);box-shadow:0 6px 20px rgba(255,255,255,.16),inset 0 1px 0 #fff}
.g,.ic{background:rgba(255,255,255,.1)}
.start{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border-color:rgba(255,255,255,.22);font-weight:800;letter-spacing:.06em;font-size:15px;padding:13px 28px}
.chip{font-weight:800}.chip.on{background:linear-gradient(180deg,#fff,#c9d1d7);box-shadow:0 0 14px rgba(255,255,255,.35)}
.tabs{border-radius:32px;padding:7px}.tabs button{border:0;border-radius:26px;font-weight:700;letter-spacing:.02em}.tabs button.on{background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);color:#fff}
input{border-radius:14px}input:focus{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.bar{height:8px}.bar i{background:linear-gradient(90deg,#8d98a0,#fff);border-radius:6px}
.st{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.1)}
.st .mu{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.st b{font-weight:800;letter-spacing:-.03em}
.sx button{border-radius:14px}.sx .on{background:linear-gradient(180deg,#fff,#c9d1d7)}
.bt{width:40px;height:74px;border:0;border-radius:0;clip-path:polygon(34% 0,66% 0,66% 11%,100% 27%,100% 100%,0 100%,0 27%,34% 11%);background:rgba(255,255,255,.13)}
.ring{filter:drop-shadow(0 0 12px rgba(255,255,255,.22))}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#0b0e10;background:linear-gradient(145deg,#fff,#aeb8bf);flex:none}
.dt::first-letter{text-transform:uppercase}
.sh{border-radius:30px 30px 0 0}.sh:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:-10px auto 14px}
.ex{padding:16px 0}.ex b{font-weight:700}.wr{padding:12px 0}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .22s ease}@keyframes up{from{transform:translateY(24px);opacity:0}}}
.evr{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:14px 16px;border-radius:20px;margin-bottom:10px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12)}.evr b,.evr span{display:block}.evr b{font-size:17px;font-weight:700}.dl{font-weight:800;white-space:nowrap}
.mt{display:flex;gap:8px;margin:14px 0}.mt button{flex:1;padding:9px 0;font-size:14px}.mt .on{background:linear-gradient(180deg,#fff,#c9d1d7);color:#0b0e10}.sh{max-height:88vh;overflow:auto}
@media (prefers-reduced-motion:no-preference){.ov{animation:f .15s}@keyframes f{from{opacity:0}}}
</style></head><body>
<div id="app"></div>
<nav class="tabs" id="nav"></nav>
<script>
const K='meutreino.v1',uid=()=>Math.random().toString(36).slice(2,9),
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
E=(n,k)=>({id:uid(),name:n,sets:4,reps:10,kg:k});
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={w:[
{id:uid(),name:'Inferiores A',ex:[E('Agachamento livre',45),E('Cadeira extensora',69),E('Leg press 45',160),E('Panturrilha sentado',20)]},
{id:uid(),name:'Inferiores B',ex:[E('Cadeira flexora',49),E('Stiff com barra',35),E('Elevação pélvica máquina',72),E('Panturrilha sentado',20)]},
{id:uid(),name:'Superiores A',ex:[]}],goal:3000,water:{},weights:[],dn:{d:'',c:{}}};
let DB=null,UID=null,tm=null;
const push=async()=>{try{if(DB&&navigator.onLine!==false)await DB.doc('app').set({json:JSON.stringify(S)})}catch(e){}};
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(DB){clearTimeout(tm);tm=setTimeout(push,400)}};
let tab='t',open=null;
const W=()=>S.w.find(w=>w.id===open);
if(S.dn.d!==today())S.dn={d:today(),c:{}};

function sheet(title,fields,onSave,extra=[]){
 const d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="sh" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="fl">${fields.map(f=>`<label class="${f.s?'s':''}">${f.l}<input id="f_${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(f.v)}"></label>`).join('')}</div><div class="row">${extra.map((x,i)=>`<button class="g ${x.c||''}" data-x="${i}">${x.l}</button>`).join('')}<button class="p" id="ok">Salvar</button></div></div>`;
 d.onclick=e=>{if(e.target===d)d.remove()};
 document.body.appendChild(d);
 const get=()=>Object.fromEntries(fields.map(f=>[f.k,d.querySelector('#f_'+f.k).value.trim()]));
 d.querySelector('#ok').onclick=()=>{onSave(get());d.remove();save();R()};
 d.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{extra[b.dataset.x].f();d.remove();save();R()});
 const i=d.querySelector('input');if(i)i.focus();
}
const num=(v,def)=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?def:n};

function newWorkout(){sheet('Novo treino',[{k:'n',l:'Nome do treino (ex: Superiores A)'}],v=>{if(v.n){const w={id:uid(),name:v.n,ex:[]};S.w.push(w);open=w.id}})}
function wMenu(id){const w=S.w.find(x=>x.id===(id||open));sheet('Treino',[{k:'n',l:'Nome do treino',v:w.name}],v=>{if(v.n)w.name=v.n},
 [{l:'Duplicar',f:()=>{S.w.push({id:uid(),name:w.name+' (cópia)',ex:w.ex.map(e=>({...e,id:uid()}))})}},
  {l:'Excluir',c:'dn',f:()=>delW(w.id)}])}
function exSheet(e){const w=W(),isNew=!e;e=e||{name:'',sets:3,reps:10,kg:''};
 const i=w.ex.indexOf(e),mv=d=>{const j=i+d;if(j>=0&&j<w.ex.length)[w.ex[i],w.ex[j]]=[w.ex[j],w.ex[i]]};
 sheet(isNew?'Novo exercício':'Editar exercício',[{k:'name',l:'Exercício',v:e.name},{k:'sets',l:'Séries',t:'number',v:e.sets,s:1},{k:'reps',l:'Repetições',t:'number',v:e.reps,s:1},{k:'kg',l:'Peso (kg)',t:'number',v:e.kg,s:1}],
 v=>{if(!v.name)return;const o={name:v.name,sets:Math.max(1,num(v.sets,3)|0),reps:Math.max(1,num(v.reps,10)|0),kg:num(v.kg,0)};
  if(isNew)w.ex.push({id:uid(),...o});else{if(o.kg!==num(e.kg,0))e.ks=null;Object.assign(e,o)}},
 isNew?[]:[{l:'↑',f:()=>mv(-1)},{l:'↓',f:()=>mv(1)},{l:'Excluir',c:'dn',f:()=>{w.ex.splice(i,1)}}])}
function tapSet(id,n){unlock();const e=W().ex.find(x=>x.id===id),c=S.dn.c[id]||0,nc=c===n+1?n:n+1;S.dn.c[id]=nc;const adv=nc>c;if(adv){for(let i=c;i<nc;i++){checkPR(e,i);logSet(e,i)}if(!S.wt)S.wt={id:open,st:Date.now(),acc:0,run:true}}if(!adv)for(let i=nc;i<c;i++)unlogSet(e);save();R();if(adv)startRest()}

function home(){
 return `<div class="top"><div><h1>Meus treinos</h1><div class="mu dt">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div></div><button class="p" onclick="newWorkout()">+ Novo</button></div>`+
 (S.w.length?S.w.map(w=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h2>${esc(w.name)}</h2><button class="ic" onclick="wMenu('${w.id}')" aria-label="Opções do treino">⋯</button></div><div class="mu">${w.ex.length} exercícios${w.ex.length?' • '+estTxt(w):''}</div><div class="cr"><span class="mu">${w.ex.slice(0,2).map(e=>esc(e.name)).join(', ')||'Sem exercícios ainda'}</span><button class="start" onclick="go('${w.id}')">${S.wt&&S.wt.id===w.id?'CONTINUAR':'INICIAR'}</button></div></div>`).join(''):'<div class="empty">Nenhum treino criado. Toque em Novo para começar.</div>');
}
function detail(){
 const w=W();let tot=0,dn=0;w.ex.forEach(e=>{tot+=e.sets;dn+=Math.min(S.dn.c[e.id]||0,e.sets)});
 return `<div class="top"><button class="ic" onclick="go(null)" aria-label="Voltar">‹</button><h1 style="flex:1">${esc(w.name)}</h1><button class="ic" onclick="wMenu()" aria-label="Opções">⋯</button></div>
 <div class="mu" style="margin:-8px 0 12px">${tot?`${dn} de ${tot} séries feitas hoje`:'Adicione o primeiro exercício'}</div><div class="bar" style="margin:0 0 14px"><i style="width:${tot?dn/tot*100:0}%"></i></div>
 <div class="card" style="padding:6px 18px">${w.ex.map(e=>`<div class="ex ${(S.dn.c[e.id]||0)>=e.sets?'fin':''}"><div><b>${esc(e.name)}${(S.dn.c[e.id]||0)>=e.sets?' ✓':''}</b><div class="mu">${e.sets} séries • ${e.reps} reps • ${kgTxt(e)}${S.pr&&S.pr[pk(e)]?' • recorde '+fmt(S.pr[pk(e)])+'kg':''}</div><div class="chips">${Array.from({length:e.sets},(_,i)=>`<div class="sc"><button class="chip ${(S.dn.c[e.id]||0)>i?'on':''}" onclick="tapSet('${e.id}',${i})" aria-label="Série ${i+1}">${i+1}</button><input class="ki" type="number" inputmode="decimal" step="any" onfocus="this.select()" value="${kgOf(e,i)}" onchange="setKg('${e.id}',${i},this.value)" aria-label="Peso da série ${i+1} em kg"></div>`).join('')}</div></div><button class="ic" onclick="exSheet(W().ex.find(x=>x.id==='${e.id}'))" aria-label="Editar">⋮</button></div>`).join('')||'<div class="empty">Nenhum exercício neste treino.</div>'}</div>
 <button class="add" onclick="exSheet()">+ Adicionar exercício</button>
 ${tot?`<button class="g" style="width:100%;margin-top:10px" onclick="S.dn.c={};save();R()">Zerar séries de hoje</button>`:''}`;
}
function water(){
 const t=S.water[today()]||0,p=Math.min(1,t/S.goal),r=84,c=2*Math.PI*r;
 return `<div class="top"><h1>Água</h1><button class="g" onclick="goal()">Meta: ${(S.goal/1000).toFixed(1).replace('.',',')} L</button></div>
 <svg class="ring" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="${t} de ${S.goal} ml"><circle cx="110" cy="110" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="16"/><circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--ac)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 110 110)"/><text x="110" y="112" text-anchor="middle" class="big" font-size="46" fill="#f4f6f8">${t}</text><text x="110" y="140" text-anchor="middle" fill="#8a9a9f" font-size="15">de ${S.goal} ml</text></svg>
 <div class="btns">${[200,300,500].map(n=>`<button class="p" onclick="addW(${n})">+${n} ml</button>`).join('')}</div>
 <button class="g" style="width:100%;margin-top:10px" onclick="addW(-200)">Desfazer 200 ml</button>
 ${t>=S.goal?'<p class="mu" style="text-align:center">Meta de hoje batida.</p>':''}`;
}
function addW(n){const d=today();S.water[d]=Math.max(0,(S.water[d]||0)+n);save();R()}
function goal(){sheet('Meta diária de água',[{k:'g',l:'Meta em ml',t:'number',v:S.goal}],v=>{S.goal=Math.max(500,num(v.g,S.goal)|0)})}
function weight(){
 const ws=S.weights,l=ws.slice(-14);let ch='';
 if(l.length>1){const mn=Math.min(...l.map(x=>x.kg))-1,mx=Math.max(...l.map(x=>x.kg))+1,pts=l.map((x,i)=>`${10+i*(280/(l.length-1))},${90-(x.kg-mn)/(mx-mn)*80}`).join(' ');
  ch=`<svg viewBox="0 0 300 100" width="100%" role="img" aria-label="Evolução do peso"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
 return `<div class="top"><h1>Peso</h1><button class="p" onclick="addWt()">+ Registrar</button></div>
 <div class="card"><div class="big" style="font-size:44px">${ws.length?ws[ws.length-1].kg.toString().replace('.',','):'--'} <span class="mu">kg</span></div>${ws.length>1?`<div class="mu">${(ws[ws.length-1].kg-ws[0].kg>0?'+':'')+(ws[ws.length-1].kg-ws[0].kg).toFixed(1).replace('.',',')} kg desde o primeiro registro</div>`:''}${ch}</div>
 ${ws.slice().reverse().slice(0,20).map(x=>`<div class="wr"><span>${x.d.split('-').reverse().join('/')}</span><b>${x.kg.toString().replace('.',',')} kg</b></div>`).join('')||'<div class="empty">Registre seu peso corporal para ver a evolução.</div>'}`;

days=k=>Object.entries(S.ev[k].d).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,s])=>({d,...dm(s)})),
r1=n=>Math.round(n*10)/10;
function prOf(k){const all=Object.values(S.ev[k].d).flat(),kg=Math.max(...all.map(x=>x[0]));return{kg,rp:Math.max(...all.filter(x=>x[0]===kg).map(x=>x[1]))}}
let EVK=[],EM='kg';
function evSection(){EVK=evK();const h='<h2 style="margin:26px 0 12px">Evolução dos exercícios</h2>';if(!EVK.length)return h+'<div class="card mu">Marque séries nos seus treinos e a evolução de cada exercício aparece aqui: recorde de carga, repetições e volume.</div>';
return h+EVK.map((k,i)=>{const ds=days(k),p=prOf(k),df=ds.length>1?r1(ds[ds.length-1].kg-ds[ds.length-2].kg):0;return `<button class="evr" onclick="evOpen(${i})"><div><b>${esc(S.ev[k].n)}</b><span class="mu">Recorde ${fmt(p.kg)}kg × ${p.rp} • ${ds.length} treino${ds.length>1?'s':''}</span></div><span class="dl">${ds.length<2?'novo':df>0?'▲ +'+fmt(df)+'kg':df<0?'▼ '+fmt(df)+'kg':'= igual'}</span></button>`}).join('')}
function bars(v,lb){const hi=Math.max(...v),lw=Math.min(...v),lo=lw-((hi-lw)||hi*.2||1),w=280/v.length,bw=Math.min(30,w-6);return `<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Evolução">${v.map((x,i)=>{const hh=12+(x-lo)/(hi-lo)*78,cx=10+w*i+w/2;return `<rect x="${cx-bw/2}" y="${105-hh}" width="${bw}" height="${hh}" rx="4" fill="${i===v.length-1?'#fff':'rgba(255,255,255,.3)'}"/><text x="${cx}" y="${100-hh}" text-anchor="middle" font-size="9" fill="#f4f6f8">${fmt(r1(x))}</text><text x="${cx}" y="122" text-anchor="middle" font-size="8" fill="#9aa4ab">${lb[i]}</text>`}).join('')}</svg>`}
function evOpen(i,m){EM=m||EM;const k=EVK[i],ds=days(k),p=prOf(k),l=ds.slice(-12);let d=document.getElementById('evo');if(!d){d=document.createElement('div');d.className='ov';d.id='evo';d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
const T=(a,b)=>`<div class="st"><span class="mu">${a}</span><b>${b}</b></div>`;
d.innerHTML=`<div class="sh"><h3>${esc(S.ev[k].n)}</h3><div class="mt">${[['kg','Carga'],['rp','Reps'],['vol','Volume']].map(([a,t])=>`<button class="g ${EM===a?'on':''}" onclick="evOpen(${i},'${a}')">${t}</button>`).join('')}</div>${bars(l.map(x=>x[EM]),l.map(x=>x.d.slice(8)+'/'+x.d.slice(5,7)))}<div class="g2" style="margin-top:12px">${T('Recorde de carga',fmt(p.kg)+'kg')}${T('Reps no recorde',p.rp)}${T('1RM estimado',Math.round(Math.max(...ds.map(x=>x.e1)))+'kg')}${T('Melhor volume',ml(Math.max(...ds.map(x=>x.vol)))+'kg')}${T('Treinos feitos',ds.length)}${T('Carga',fmt(ds[0].kg)+' → '+fmt(ds[ds.length-1].kg)+'kg')}</div><div class="row" style="margin-top:14px"><button class="p" onclick="document.getElementById('evo').remove()">Fechar</button></div></div>`}
const _h0=home;home=()=>{const h=_h0(),i=h.indexOf('<div class="card">');return i<0?h+miniWater():h.slice(0,i)+miniWater()+h.slice(i)};
function miniWater(){const t=S.water[today()]||0;return `<div class="card" style="display:flex;align-items:center;gap:12px;padding:14px 18px"><div style="flex:1"><div class="mu">Água hoje</div><div class="big" style="font-size:26px">${fmt(Math.round(t/S.bt*10)/10)} de ${S.gb} garrafas</div><div class="bar" style="margin:8px 0 0"><i style="width:${Math.min(100,t/G()*100)}%"></i></div></div><button class="p" onclick="addW(${S.bt})" aria-label="Adicionar uma garrafa">+1</button></div>`}
function go(id){if(!id&&S.wt)id=S.wt.id;open=id;R();tick();window.scrollTo(0,0)}
function nav(k){tab=k;open=(k==='t'&&S.wt)?S.wt.id:null;R();tick()}
R();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script></body></html>
